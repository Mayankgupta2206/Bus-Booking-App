<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F1D27"/>
      <stop offset="100%" stop-color="#5B0E14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF85"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Bus Body -->
  <rect x="96" y="130" width="320" height="250" rx="36" fill="#FFFFFF"/>
  <!-- Windshield -->
  <rect x="120" y="156" width="272" height="96" rx="16" fill="#1E293B"/>
  <rect x="136" y="168" width="116" height="72" rx="8" fill="#38BDF8" fill-opacity="0.85"/>
  <rect x="260" y="168" width="116" height="72" rx="8" fill="#38BDF8" fill-opacity="0.85"/>
  <!-- Headlights -->
  <circle cx="146" cy="320" r="18" fill="url(#gold)"/>
  <circle cx="366" cy="320" r="18" fill="url(#gold)"/>
  <!-- Grill lines -->
  <rect x="190" y="306" width="132" height="8" rx="4" fill="#94A3B8"/>
  <rect x="204" y="324" width="104" height="8" rx="4" fill="#94A3B8"/>
  <!-- Wheels -->
  <rect x="124" y="375" width="56" height="30" rx="8" fill="#1E293B"/>
  <rect x="332" y="375" width="56" height="30" rx="8" fill="#1E293B"/>
  <!-- Badge / Seva Text -->
  <rect x="180" y="70" width="152" height="42" rx="21" fill="url(#gold)"/>
  <text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#5B0E14" text-anchor="middle" letter-spacing="2">SEVA</text>
</svg>
