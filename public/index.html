<script>
(function() {
  var h = window.location.hostname.toLowerCase();
  var isPassengerSite = h.includes('pass') || h.includes('ticket') || window.PUBLIC_PASSENGER_MODE;
  if (isPassengerSite && window.location.pathname !== '/ticket' && window.location.pathname !== '/ticket.html' && window.location.pathname !== '/pass') {
    window.location.replace('/ticket' + window.location.search);
  }
})();
</script>
